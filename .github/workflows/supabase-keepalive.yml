# Pings Supabase daily so free-tier projects don't auto-pause after ~7 days idle.
# The in-app KeepAliveService only runs while Margin is open in a browser tab.
#
# Setup (one time): GitHub repo → Settings → Secrets and variables → Actions
#   SUPABASE_URL        — same value as VITE_SUPABASE_URL
#   SUPABASE_ANON_KEY   — same value as VITE_SUPABASE_ANON_KEY

name: Supabase keep-alive

on:
  schedule:
    # Daily at 14:00 UTC (~9–10am US Central, depending on DST)
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_ANON_KEY repository secrets."
            echo "Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

          url="${SUPABASE_URL%/}/auth/v1/health"
          echo "Pinging ${url} ..."

          http_code="$(
            curl --silent --show-error --output /tmp/supabase-keepalive-body.txt --write-out '%{http_code}' \
              --max-time 30 \
              --header "apikey: ${SUPABASE_ANON_KEY}" \
              --header "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
              --header 'Accept: application/json' \
              "${url}"
          )"

          echo "HTTP ${http_code}"
          echo "Response: $(head -c 200 /tmp/supabase-keepalive-body.txt)"

          if [ "${http_code}" != '200' ]; then
            echo "Keep-alive ping failed. If the project is paused, resume it in the Supabase dashboard."
            exit 1
          fi

          echo "Keep-alive ping succeeded."
